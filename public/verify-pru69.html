<!DOCTYPE html>

<title>Certificate Verification - SPUBUS Academy</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f4f8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .container{max-width:480px;width:100%;margin:0 auto}
  .logo-section{text-align:center;margin-bottom:24px}
  .logo-icon{width:56px;height:56px;background:linear-gradient(135deg,#e8f4fd,#d0eafc);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:28px;color:#2563eb}
  .logo-title{font-size:14px;letter-spacing:3px;color:#2563eb;font-weight:700;text-transform:uppercase}
  .logo-sub{font-size:12px;color:#64748b;margin-top:4px}
  .status-bar{display:flex;align-items:center;gap:10px;padding:14px 20px;border-radius:12px;margin-bottom:20px}
  .status-bar.valid{background:linear-gradient(135deg,#e8fdf0,#d1fae5);border:1px solid #86efac}
  .status-bar.invalid{background:#fef2f2;border:1px solid #fecaca}
  .status-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px}
  .status-bar.valid .status-icon{background:#22c55e;color:#fff}
  .status-bar.invalid .status-icon{background:#ef4444;color:#fff}
  .status-text h3{font-size:15px;font-weight:600}
  .status-bar.valid .status-text h3{color:#16a34a}
  .status-bar.invalid .status-text h3{color:#dc2626}
  .status-text p{font-size:11px;color:#64748b;margin-top:2px}
  .cert-card{background:#fff;border-radius:16px;border:2px solid #e0eef9;padding:32px 24px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,0.06)}
  .cert-label{font-size:11px;letter-spacing:2px;color:#2563eb;font-weight:600;text-transform:uppercase}
  .cert-title{font-size:24px;font-weight:700;color:#1e293b;margin:8px 0}
  .cert-org{font-size:13px;color:#64748b;margin-bottom:20px}
  .divider{width:60px;height:2px;background:linear-gradient(90deg,#93c5fd,#3b82f6);margin:0 auto 20px;border-radius:2px}
  .info-cards{display:flex;gap:10px;margin:24px 0}
  .info-card{flex:1;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:14px 8px;text-align:center}
  .info-card .ic-icon{font-size:20px;color:#2563eb;margin-bottom:6px}
  .info-card .ic-label{font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:1px}
  .info-card .ic-value{font-size:13px;font-weight:600;color:#1e293b;margin-top:4px;line-height:1.3}
  .issuer-section{margin-top:24px;padding-top:20px;border-top:1px solid #e2e8f0}
  .issuer-name{font-size:15px;font-weight:600;color:#1e293b}
  .issuer-title{font-size:12px;color:#64748b;margin-top:4px}
  .cert-code-section{margin-top:24px}
  .cert-code-label{font-size:11px;color:#94a3b8}
  .cert-code{font-size:16px;font-weight:700;color:#2563eb;font-family:'Courier New',monospace;letter-spacing:1px;margin-top:4px}
  .footer{text-align:center;margin-top:20px;font-size:11px;color:#94a3b8}
  .footer .check{color:#22c55e}
  .not-found{text-align:center;padding:60px 20px}
  .not-found .nf-icon{font-size:48px;margin-bottom:16px}
  .not-found h2{color:#dc2626;margin-bottom:8px}
  .not-found p{color:#64748b;font-size:14px}
  .name-highlight{font-size:20px;font-weight:700;color:#2563eb;margin:8px 0}
</style>

function getID(){
  const p=new URLSearchParams(location.search);
  let id=p.get('id')||p.get('ID')||'';
  if(!id){const h=location.hash.replace('#','');if(h)id=h;}
  if(!id){const parts=location.pathname.split('/').filter(Boolean);if(parts.length)id=parts[parts.length-1];}
  return id.toUpperCase();
}
