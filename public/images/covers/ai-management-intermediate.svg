<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>
  <!-- Dot pattern -->
  <g opacity="0.08">
    <circle cx="80" cy="80" r="2" fill="#8B5CF6"/><circle cx="120" cy="80" r="2" fill="#8B5CF6"/><circle cx="160" cy="80" r="2" fill="#8B5CF6"/>
    <circle cx="80" cy="120" r="2" fill="#8B5CF6"/><circle cx="120" cy="120" r="2" fill="#8B5CF6"/><circle cx="160" cy="120" r="2" fill="#8B5CF6"/>
    <circle cx="1100" cy="580" r="2" fill="#8B5CF6"/><circle cx="1140" cy="580" r="2" fill="#8B5CF6"/><circle cx="1180" cy="580" r="2" fill="#8B5CF6"/>
    <circle cx="1100" cy="620" r="2" fill="#8B5CF6"/><circle cx="1140" cy="620" r="2" fill="#8B5CF6"/><circle cx="1180" cy="620" r="2" fill="#8B5CF6"/>
  </g>
  <!-- Growth/planning icons -->
  <g opacity="0.2">
    <!-- Growth arrow chart -->
    <g transform="translate(460, 130)">
      <line x1="0" y1="120" x2="0" y2="0" stroke="#8B5CF6" stroke-width="1.5"/>
      <line x1="0" y1="120" x2="160" y2="120" stroke="#8B5CF6" stroke-width="1.5"/>
      <!-- Stacked growth -->
      <path d="M15,100 L50,85 L85,70 L120,40 L150,15" fill="none" stroke="#8B5CF6" stroke-width="2"/>
      <!-- Growth area fill -->
      <path d="M15,100 L50,85 L85,70 L120,40 L150,15 L150,120 L15,120 Z" fill="#8B5CF6" opacity="0.06"/>
      <!-- Milestone dots -->
      <circle cx="15" cy="100" r="4" fill="#8B5CF6" opacity="0.5"/>
      <circle cx="50" cy="85" r="4" fill="#8B5CF6" opacity="0.5"/>
      <circle cx="85" cy="70" r="4" fill="#8B5CF6" opacity="0.5"/>
      <circle cx="120" cy="40" r="4" fill="#8B5CF6" opacity="0.5"/>
      <circle cx="150" cy="15" r="5" fill="#8B5CF6" opacity="0.7"/>
      <!-- Arrow at end -->
      <path d="M145,20 L155,10 L152,22" fill="none" stroke="#8B5CF6" stroke-width="1.5"/>
    </g>
    <!-- Planning/roadmap blocks -->
    <g transform="translate(720, 140)">
      <rect x="0" y="0" width="180" height="25" rx="5" fill="#8B5CF6" opacity="0.1" stroke="#8B5CF6" stroke-width="1"/>
      <rect x="0" y="0" width="120" height="25" rx="5" fill="#8B5CF6" opacity="0.15"/>
      <text x="60" y="17" font-family="system-ui, sans-serif" font-size="9" fill="#8B5CF6" text-anchor="middle" opacity="0.6">Q1</text>
      <rect x="0" y="35" width="180" height="25" rx="5" fill="#8B5CF6" opacity="0.1" stroke="#8B5CF6" stroke-width="1"/>
      <rect x="20" y="35" width="140" height="25" rx="5" fill="#8B5CF6" opacity="0.2"/>
      <text x="90" y="52" font-family="system-ui, sans-serif" font-size="9" fill="#8B5CF6" text-anchor="middle" opacity="0.6">Q2</text>
      <rect x="0" y="70" width="180" height="25" rx="5" fill="#8B5CF6" opacity="0.1" stroke="#8B5CF6" stroke-width="1"/>
      <rect x="40" y="70" width="140" height="25" rx="5" fill="#8B5CF6" opacity="0.25"/>
      <text x="110" y="87" font-family="system-ui, sans-serif" font-size="9" fill="#8B5CF6" text-anchor="middle" opacity="0.6">Q3</text>
    </g>
  </g>
  <!-- Target/goal icon -->
  <g transform="translate(400, 230)" opacity="0.1">
    <path d="M0,-12 L4,-4 L12,0 L4,4 L0,12 L-4,4 L-12,0 L-4,-4 Z" fill="#8B5CF6"/>
  </g>
  <!-- Decorative circles -->
  <circle cx="180" cy="520" r="100" fill="#8B5CF6" opacity="0.03"/>
  <circle cx="1100" cy="180" r="80" fill="#8B5CF6" opacity="0.03"/>
  <!-- Level Badge -->
  <rect x="1040" y="30" width="210" height="42" rx="21" fill="#3B82F6"/>
  <text x="1145" y="57" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">◆ Intermediate</text>
  <!-- Title -->
  <text x="640" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="white" text-anchor="middle">AI Strategic Planning</text>
  <text x="640" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#94A3B8" text-anchor="middle">Plan and execute business strategy with AI intelligence</text>
  <rect x="540" y="480" width="200" height="3" rx="1.5" fill="#8B5CF6" opacity="0.6"/>
  <!-- Bottom branding -->
  <text x="640" y="670" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#475569" text-anchor="middle" letter-spacing="2">AI BUSINESS ACADEMY</text>
  <rect x="440" y="685" width="400" height="1" fill="#334155" opacity="0.5"/>
</svg>