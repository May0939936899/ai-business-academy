<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>
  <!-- Dot pattern -->
  <g opacity="0.08">
    <circle cx="80" cy="80" r="2" fill="#3B82F6"/><circle cx="120" cy="80" r="2" fill="#3B82F6"/><circle cx="160" cy="80" r="2" fill="#3B82F6"/><circle cx="200" cy="80" r="2" fill="#3B82F6"/>
    <circle cx="80" cy="120" r="2" fill="#3B82F6"/><circle cx="120" cy="120" r="2" fill="#3B82F6"/><circle cx="160" cy="120" r="2" fill="#3B82F6"/><circle cx="200" cy="120" r="2" fill="#3B82F6"/>
    <circle cx="1080" cy="580" r="2" fill="#3B82F6"/><circle cx="1120" cy="580" r="2" fill="#3B82F6"/><circle cx="1160" cy="580" r="2" fill="#3B82F6"/><circle cx="1200" cy="580" r="2" fill="#3B82F6"/>
    <circle cx="1080" cy="620" r="2" fill="#3B82F6"/><circle cx="1120" cy="620" r="2" fill="#3B82F6"/><circle cx="1160" cy="620" r="2" fill="#3B82F6"/><circle cx="1200" cy="620" r="2" fill="#3B82F6"/>
  </g>
  <!-- Bar chart -->
  <g transform="translate(440, 120)" opacity="0.25">
    <!-- Axis -->
    <line x1="0" y1="150" x2="0" y2="0" stroke="#3B82F6" stroke-width="1.5"/>
    <line x1="0" y1="150" x2="200" y2="150" stroke="#3B82F6" stroke-width="1.5"/>
    <!-- Bars -->
    <rect x="15" y="100" width="25" height="50" rx="3" fill="#3B82F6" opacity="0.4"/>
    <rect x="50" y="70" width="25" height="80" rx="3" fill="#3B82F6" opacity="0.5"/>
    <rect x="85" y="40" width="25" height="110" rx="3" fill="#3B82F6" opacity="0.6"/>
    <rect x="120" y="60" width="25" height="90" rx="3" fill="#3B82F6" opacity="0.5"/>
    <rect x="155" y="20" width="25" height="130" rx="3" fill="#3B82F6" opacity="0.7"/>
    <!-- Grid lines -->
    <line x1="0" y1="50" x2="200" y2="50" stroke="#3B82F6" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.3"/>
    <line x1="0" y1="100" x2="200" y2="100" stroke="#3B82F6" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.3"/>
  </g>
  <!-- Data points scatter -->
  <g transform="translate(720, 140)" opacity="0.15">
    <circle cx="10" cy="80" r="5" fill="#3B82F6"/>
    <circle cx="30" cy="60" r="6" fill="#3B82F6"/>
    <circle cx="55" cy="90" r="4" fill="#3B82F6"/>
    <circle cx="75" cy="40" r="7" fill="#3B82F6"/>
    <circle cx="100" cy="55" r="5" fill="#3B82F6"/>
    <circle cx="120" cy="30" r="6" fill="#3B82F6"/>
    <circle cx="145" cy="70" r="4" fill="#3B82F6"/>
    <circle cx="160" cy="20" r="8" fill="#3B82F6"/>
    <!-- Trend line -->
    <path d="M5,85 L165,15" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6,3"/>
  </g>
  <!-- Data icon -->
  <g transform="translate(380, 210)" opacity="0.1">
    <rect x="0" y="0" width="50" height="60" rx="6" fill="none" stroke="#3B82F6" stroke-width="1.5"/>
    <line x1="10" y1="15" x2="40" y2="15" stroke="#3B82F6" stroke-width="1"/>
    <line x1="10" y1="25" x2="35" y2="25" stroke="#3B82F6" stroke-width="1"/>
    <line x1="10" y1="35" x2="38" y2="35" stroke="#3B82F6" stroke-width="1"/>
    <line x1="10" y1="45" x2="30" y2="45" stroke="#3B82F6" stroke-width="1"/>
  </g>
  <!-- Decorative circles -->
  <circle cx="200" cy="500" r="100" fill="#3B82F6" opacity="0.03"/>
  <circle cx="1100" cy="200" r="80" fill="#3B82F6" opacity="0.04"/>
  <!-- Level Badge -->
  <rect x="1060" y="30" width="190" height="42" rx="21" fill="#10B981"/>
  <text x="1155" y="57" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">● Beginner</text>
  <!-- Title -->
  <text x="640" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="white" text-anchor="middle">AI Data Analytics</text>
  <text x="640" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#94A3B8" text-anchor="middle">Unlock the power of data with AI-driven analytics</text>
  <rect x="540" y="480" width="200" height="3" rx="1.5" fill="#3B82F6" opacity="0.6"/>
  <!-- Bottom branding -->
  <text x="640" y="670" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#475569" text-anchor="middle" letter-spacing="2">AI BUSINESS ACADEMY</text>
  <rect x="440" y="685" width="400" height="1" fill="#334155" opacity="0.5"/>
</svg>