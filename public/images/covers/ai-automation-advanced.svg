<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>
  <!-- Dot pattern -->
  <g opacity="0.08">
    <circle cx="80" cy="80" r="2" fill="#06B6D4"/><circle cx="120" cy="80" r="2" fill="#06B6D4"/><circle cx="160" cy="80" r="2" fill="#06B6D4"/>
    <circle cx="80" cy="120" r="2" fill="#06B6D4"/><circle cx="120" cy="120" r="2" fill="#06B6D4"/><circle cx="160" cy="120" r="2" fill="#06B6D4"/>
    <circle cx="1100" cy="580" r="2" fill="#06B6D4"/><circle cx="1140" cy="580" r="2" fill="#06B6D4"/><circle cx="1180" cy="580" r="2" fill="#06B6D4"/>
    <circle cx="1100" cy="620" r="2" fill="#06B6D4"/><circle cx="1140" cy="620" r="2" fill="#06B6D4"/><circle cx="1180" cy="620" r="2" fill="#06B6D4"/>
  </g>
  <!-- Enterprise network/dashboard -->
  <g opacity="0.2">
    <!-- Central hub -->
    <circle cx="640" cy="200" r="30" fill="none" stroke="#06B6D4" stroke-width="2"/>
    <circle cx="640" cy="200" r="12" fill="#06B6D4" opacity="0.3"/>
    <!-- Satellite nodes -->
    <circle cx="460" cy="140" r="18" fill="none" stroke="#06B6D4" stroke-width="1.5"/>
    <circle cx="820" cy="140" r="18" fill="none" stroke="#06B6D4" stroke-width="1.5"/>
    <circle cx="460" cy="260" r="18" fill="none" stroke="#06B6D4" stroke-width="1.5"/>
    <circle cx="820" cy="260" r="18" fill="none" stroke="#06B6D4" stroke-width="1.5"/>
    <circle cx="360" cy="200" r="14" fill="none" stroke="#06B6D4" stroke-width="1"/>
    <circle cx="920" cy="200" r="14" fill="none" stroke="#06B6D4" stroke-width="1"/>
    <!-- Connection lines -->
    <line x1="478" y1="148" x2="612" y2="190" stroke="#06B6D4" stroke-width="1"/>
    <line x1="802" y1="148" x2="668" y2="190" stroke="#06B6D4" stroke-width="1"/>
    <line x1="478" y1="252" x2="612" y2="210" stroke="#06B6D4" stroke-width="1"/>
    <line x1="802" y1="252" x2="668" y2="210" stroke="#06B6D4" stroke-width="1"/>
    <line x1="374" y1="200" x2="610" y2="200" stroke="#06B6D4" stroke-width="1"/>
    <line x1="906" y1="200" x2="670" y2="200" stroke="#06B6D4" stroke-width="1"/>
    <!-- Outer nodes -->
    <circle cx="340" cy="120" r="8" fill="none" stroke="#06B6D4" stroke-width="1" opacity="0.5"/>
    <circle cx="940" cy="120" r="8" fill="none" stroke="#06B6D4" stroke-width="1" opacity="0.5"/>
    <line x1="348" y1="124" x2="444" y2="138" stroke="#06B6D4" stroke-width="0.5" opacity="0.5"/>
    <line x1="932" y1="124" x2="836" y2="138" stroke="#06B6D4" stroke-width="0.5" opacity="0.5"/>
  </g>
  <!-- Dashboard mini -->
  <g opacity="0.12" transform="translate(500,240)">
    <rect x="0" y="0" width="280" height="60" rx="6" fill="none" stroke="#06B6D4" stroke-width="1"/>
    <rect x="10" y="10" width="40" height="40" rx="4" fill="#06B6D4" opacity="0.2"/>
    <rect x="60" y="15" width="80" height="6" rx="3" fill="#06B6D4" opacity="0.3"/>
    <rect x="60" y="30" width="120" height="4" rx="2" fill="#06B6D4" opacity="0.15"/>
    <rect x="60" y="40" width="60" height="4" rx="2" fill="#06B6D4" opacity="0.15"/>
  </g>
  <!-- Decorative circles -->
  <circle cx="180" cy="500" r="100" fill="#06B6D4" opacity="0.03"/>
  <circle cx="1100" cy="550" r="80" fill="#06B6D4" opacity="0.03"/>
  <!-- Level Badge -->
  <rect x="1060" y="30" width="190" height="42" rx="21" fill="#8B5CF6"/>
  <text x="1155" y="57" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">★ Advanced</text>
  <!-- Title -->
  <text x="640" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="white" text-anchor="middle">Enterprise AI Automation</text>
  <text x="640" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#94A3B8" text-anchor="middle">Scale AI automation across the entire organization</text>
  <rect x="540" y="490" width="200" height="3" rx="1.5" fill="#06B6D4" opacity="0.6"/>
  <!-- Bottom branding -->
  <text x="640" y="670" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#475569" text-anchor="middle" letter-spacing="2">AI BUSINESS ACADEMY</text>
  <rect x="440" y="685" width="400" height="1" fill="#334155" opacity="0.5"/>
</svg>