<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>
  <!-- Dot pattern -->
  <g opacity="0.08">
    <circle cx="80" cy="80" r="2" fill="#8B5CF6"/><circle cx="120" cy="80" r="2" fill="#8B5CF6"/><circle cx="160" cy="80" r="2" fill="#8B5CF6"/><circle cx="200" cy="80" r="2" fill="#8B5CF6"/>
    <circle cx="80" cy="120" r="2" fill="#8B5CF6"/><circle cx="120" cy="120" r="2" fill="#8B5CF6"/><circle cx="160" cy="120" r="2" fill="#8B5CF6"/><circle cx="200" cy="120" r="2" fill="#8B5CF6"/>
    <circle cx="1080" cy="580" r="2" fill="#8B5CF6"/><circle cx="1120" cy="580" r="2" fill="#8B5CF6"/><circle cx="1160" cy="580" r="2" fill="#8B5CF6"/><circle cx="1200" cy="580" r="2" fill="#8B5CF6"/>
    <circle cx="1080" cy="620" r="2" fill="#8B5CF6"/><circle cx="1120" cy="620" r="2" fill="#8B5CF6"/><circle cx="1160" cy="620" r="2" fill="#8B5CF6"/><circle cx="1200" cy="620" r="2" fill="#8B5CF6"/>
  </g>
  <!-- Strategy/crossroads icon -->
  <g transform="translate(640, 190)" opacity="0.2">
    <!-- Central diamond -->
    <rect x="-30" y="-30" width="60" height="60" rx="8" fill="#8B5CF6" opacity="0.15" stroke="#8B5CF6" stroke-width="2" transform="rotate(45)"/>
    <!-- Paths branching out -->
    <line x1="-60" y1="0" x2="-120" y2="-40" stroke="#8B5CF6" stroke-width="1.5"/>
    <line x1="60" y1="0" x2="120" y2="-40" stroke="#8B5CF6" stroke-width="1.5"/>
    <line x1="0" y1="-60" x2="0" y2="-100" stroke="#8B5CF6" stroke-width="1.5"/>
    <!-- End nodes -->
    <circle cx="-120" cy="-40" r="12" fill="none" stroke="#8B5CF6" stroke-width="1.5"/>
    <circle cx="120" cy="-40" r="12" fill="none" stroke="#8B5CF6" stroke-width="1.5"/>
    <circle cx="0" cy="-100" r="12" fill="none" stroke="#8B5CF6" stroke-width="1.5"/>
    <!-- Labels -->
    <text x="-120" y="-37" font-family="system-ui, sans-serif" font-size="8" fill="#8B5CF6" text-anchor="middle" opacity="0.6">A</text>
    <text x="120" y="-37" font-family="system-ui, sans-serif" font-size="8" fill="#8B5CF6" text-anchor="middle" opacity="0.6">B</text>
    <text x="0" y="-97" font-family="system-ui, sans-serif" font-size="8" fill="#8B5CF6" text-anchor="middle" opacity="0.6">C</text>
  </g>
  <!-- Data flowing to decision -->
  <g opacity="0.12">
    <!-- Data streams -->
    <rect x="400" y="220" width="60" height="35" rx="5" fill="none" stroke="#8B5CF6" stroke-width="1"/>
    <line x1="412" y1="232" x2="448" y2="232" stroke="#8B5CF6" stroke-width="0.8"/>
    <line x1="412" y1="240" x2="440" y2="240" stroke="#8B5CF6" stroke-width="0.8"/>
    <line x1="412" y1="248" x2="445" y2="248" stroke="#8B5CF6" stroke-width="0.8"/>
    <path d="M460,237 L480,237" stroke="#8B5CF6" stroke-width="1"/>
    <polygon points="480,234 486,237 480,240" fill="#8B5CF6"/>
    <rect x="820" y="220" width="60" height="35" rx="5" fill="none" stroke="#8B5CF6" stroke-width="1"/>
    <line x1="832" y1="232" x2="868" y2="232" stroke="#8B5CF6" stroke-width="0.8"/>
    <line x1="832" y1="240" x2="860" y2="240" stroke="#8B5CF6" stroke-width="0.8"/>
    <line x1="832" y1="248" x2="865" y2="248" stroke="#8B5CF6" stroke-width="0.8"/>
    <path d="M820,237 L800,237" stroke="#8B5CF6" stroke-width="1"/>
    <polygon points="800,234 794,237 800,240" fill="#8B5CF6"/>
  </g>
  <!-- Decorative circles -->
  <circle cx="200" cy="500" r="100" fill="#8B5CF6" opacity="0.03"/>
  <circle cx="1100" cy="200" r="80" fill="#8B5CF6" opacity="0.04"/>
  <!-- Level Badge -->
  <rect x="1060" y="30" width="190" height="42" rx="21" fill="#10B981"/>
  <text x="1155" y="57" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">● Beginner</text>
  <!-- Title -->
  <text x="640" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="white" text-anchor="middle">AI Business Decision Making</text>
  <text x="640" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#94A3B8" text-anchor="middle">Make smarter business decisions powered by AI insights</text>
  <rect x="540" y="480" width="200" height="3" rx="1.5" fill="#8B5CF6" opacity="0.6"/>
  <!-- Bottom branding -->
  <text x="640" y="670" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#475569" text-anchor="middle" letter-spacing="2">AI BUSINESS ACADEMY</text>
  <rect x="440" y="685" width="400" height="1" fill="#334155" opacity="0.5"/>
</svg>