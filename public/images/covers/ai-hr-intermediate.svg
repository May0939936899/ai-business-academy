<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>
  <!-- Dot pattern -->
  <g opacity="0.08">
    <circle cx="80" cy="80" r="2" fill="#10B981"/><circle cx="120" cy="80" r="2" fill="#10B981"/><circle cx="160" cy="80" r="2" fill="#10B981"/>
    <circle cx="80" cy="120" r="2" fill="#10B981"/><circle cx="120" cy="120" r="2" fill="#10B981"/><circle cx="160" cy="120" r="2" fill="#10B981"/>
    <circle cx="1100" cy="580" r="2" fill="#10B981"/><circle cx="1140" cy="580" r="2" fill="#10B981"/><circle cx="1180" cy="580" r="2" fill="#10B981"/>
    <circle cx="1100" cy="620" r="2" fill="#10B981"/><circle cx="1140" cy="620" r="2" fill="#10B981"/><circle cx="1180" cy="620" r="2" fill="#10B981"/>
  </g>
  <!-- People network -->
  <g opacity="0.2">
    <!-- Central person -->
    <circle cx="640" cy="180" r="20" fill="none" stroke="#10B981" stroke-width="2"/>
    <circle cx="640" cy="165" r="10" fill="none" stroke="#10B981" stroke-width="1.5"/>
    <!-- Person left -->
    <circle cx="480" cy="160" r="16" fill="none" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="480" cy="148" r="8" fill="none" stroke="#10B981" stroke-width="1.2"/>
    <!-- Person right -->
    <circle cx="800" cy="160" r="16" fill="none" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="800" cy="148" r="8" fill="none" stroke="#10B981" stroke-width="1.2"/>
    <!-- Person top-left -->
    <circle cx="520" cy="110" r="14" fill="none" stroke="#10B981" stroke-width="1"/>
    <circle cx="520" cy="100" r="7" fill="none" stroke="#10B981" stroke-width="1"/>
    <!-- Person top-right -->
    <circle cx="760" cy="110" r="14" fill="none" stroke="#10B981" stroke-width="1"/>
    <circle cx="760" cy="100" r="7" fill="none" stroke="#10B981" stroke-width="1"/>
    <!-- Person bottom-left -->
    <circle cx="500" cy="240" r="14" fill="none" stroke="#10B981" stroke-width="1"/>
    <circle cx="500" cy="230" r="7" fill="none" stroke="#10B981" stroke-width="1"/>
    <!-- Person bottom-right -->
    <circle cx="780" cy="240" r="14" fill="none" stroke="#10B981" stroke-width="1"/>
    <circle cx="780" cy="230" r="7" fill="none" stroke="#10B981" stroke-width="1"/>
    <!-- Connection lines -->
    <line x1="496" y1="160" x2="620" y2="175" stroke="#10B981" stroke-width="1"/>
    <line x1="784" y1="160" x2="660" y2="175" stroke="#10B981" stroke-width="1"/>
    <line x1="534" y1="115" x2="625" y2="168" stroke="#10B981" stroke-width="0.8"/>
    <line x1="746" y1="115" x2="655" y2="168" stroke="#10B981" stroke-width="0.8"/>
    <line x1="514" y1="235" x2="628" y2="195" stroke="#10B981" stroke-width="0.8"/>
    <line x1="766" y1="235" x2="652" y2="195" stroke="#10B981" stroke-width="0.8"/>
    <!-- Cross connections -->
    <line x1="496" y1="168" x2="520" y2="124" stroke="#10B981" stroke-width="0.5" opacity="0.5"/>
    <line x1="784" y1="168" x2="760" y2="124" stroke="#10B981" stroke-width="0.5" opacity="0.5"/>
  </g>
  <!-- Decorative circles -->
  <circle cx="180" cy="520" r="100" fill="#10B981" opacity="0.03"/>
  <circle cx="1100" cy="180" r="80" fill="#10B981" opacity="0.03"/>
  <!-- Level Badge -->
  <rect x="1040" y="30" width="210" height="42" rx="21" fill="#3B82F6"/>
  <text x="1145" y="57" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">◆ Intermediate</text>
  <!-- Title -->
  <text x="640" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="white" text-anchor="middle">AI Talent Management</text>
  <text x="640" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#94A3B8" text-anchor="middle">Manage and develop talent with AI-powered insights</text>
  <rect x="540" y="480" width="200" height="3" rx="1.5" fill="#10B981" opacity="0.6"/>
  <!-- Bottom branding -->
  <text x="640" y="670" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#475569" text-anchor="middle" letter-spacing="2">AI BUSINESS ACADEMY</text>
  <rect x="440" y="685" width="400" height="1" fill="#334155" opacity="0.5"/>
</svg>