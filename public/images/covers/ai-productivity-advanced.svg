    <circle cx="80" cy="120" r="2" fill="#F59E0B"/><circle cx="120" cy="120" r="2" fill="#F59E0B"/><circle cx="160" cy="120" r="2" fill="#F59E0B"/>
    <circle cx="1100" cy="580" r="2" fill="#F59E0B"/><circle cx="1140" cy="580" r="2" fill="#F59E0B"/><circle cx="1180" cy="580" r="2" fill="#F59E0B"/>
  </g>
  <!-- Project dashboard -->
