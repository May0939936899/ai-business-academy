    <rect x="598" y="180" width="12" height="30" rx="2" fill="#F59E0B" opacity="0.4"/>
    <rect x="616" y="170" width="12" height="40" rx="2" fill="#F59E0B" opacity="0.5"/>
    <rect x="634" y="175" width="12" height="35" rx="2" fill="#F59E0B" opacity="0.4"/>
    <rect x="652" y="160" width="12" height="50" rx="2" fill="#F59E0B" opacity="0.6"/>
    <rect x="670" y="155" width="12" height="55" rx="2" fill="#F59E0B" opacity="0.7"/>
    <!-- Progress bars -->
    <rect x="420" y="240" width="270" height="8" rx="4" fill="#F59E0B" opacity="0.1"/>
    <rect x="420" y="240" width="200" height="8" rx="4" fill="#F59E0B" opacity="0.4"/>
    <rect x="420" y="258" width="270" height="8" rx="4" fill="#F59E0B" opacity="0.1"/>
    <rect x="420" y="258" width="150" height="8" rx="4" fill="#F59E0B" opacity="0.3"/>
