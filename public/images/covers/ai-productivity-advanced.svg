    <circle cx="535" cy="160" r="3" fill="#F59E0B"/>
    <!-- Mini chart 2 -->
    <rect x="565" y="150" width="130" height="70" rx="6" fill="#F59E0B" opacity="0.05" stroke="#F59E0B" stroke-width="0.8"/>
