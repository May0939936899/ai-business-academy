    <!-- KPI number -->
    <text x="810" y="185" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#F59E0B" opacity="0.5" text-anchor="middle">94%</text>
    <text x="810" y="205" font-family="system-ui, sans-serif" font-size="10" fill="#F59E0B" opacity="0.3" text-anchor="middle">EFFICIENCY</text>
  </g>
