<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>
  <!-- Dot pattern -->
  <g opacity="0.08">
    <circle cx="80" cy="80" r="2" fill="#3B82F6"/><circle cx="120" cy="80" r="2" fill="#3B82F6"/><circle cx="160" cy="80" r="2" fill="#3B82F6"/>
    <circle cx="80" cy="120" r="2" fill="#3B82F6"/><circle cx="120" cy="120" r="2" fill="#3B82F6"/><circle cx="160" cy="120" r="2" fill="#3B82F6"/>
    <circle cx="1100" cy="580" r="2" fill="#3B82F6"/><circle cx="1140" cy="580" r="2" fill="#3B82F6"/><circle cx="1180" cy="580" r="2" fill="#3B82F6"/>
    <circle cx="1100" cy="620" r="2" fill="#3B82F6"/><circle cx="1140" cy="620" r="2" fill="#3B82F6"/><circle cx="1180" cy="620" r="2" fill="#3B82F6"/>
  </g>
  <!-- Dashboard layout -->
  <g opacity="0.2">
    <!-- Dashboard frame -->
    <rect x="380" y="100" width="520" height="210" rx="12" fill="none" stroke="#3B82F6" stroke-width="1.5"/>
    <!-- Sidebar -->
    <rect x="380" y="100" width="80" height="210" rx="12" fill="#3B82F6" opacity="0.06"/>
    <rect x="392" y="120" width="56" height="6" rx="3" fill="#3B82F6" opacity="0.3"/>
    <rect x="392" y="140" width="56" height="6" rx="3" fill="#3B82F6" opacity="0.15"/>
    <rect x="392" y="155" width="56" height="6" rx="3" fill="#3B82F6" opacity="0.15"/>
    <rect x="392" y="170" width="56" height="6" rx="3" fill="#3B82F6" opacity="0.15"/>
    <rect x="392" y="185" width="56" height="6" rx="3" fill="#3B82F6" opacity="0.15"/>
    <!-- KPI cards -->
    <rect x="475" y="115" width="100" height="55" rx="6" fill="#3B82F6" opacity="0.06" stroke="#3B82F6" stroke-width="0.8"/>
    <text x="525" y="142" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#3B82F6" text-anchor="middle" opacity="0.6">2.4K</text>
    <rect x="585" y="115" width="100" height="55" rx="6" fill="#3B82F6" opacity="0.06" stroke="#3B82F6" stroke-width="0.8"/>
    <text x="635" y="142" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#3B82F6" text-anchor="middle" opacity="0.6">87%</text>
    <rect x="695" y="115" width="100" height="55" rx="6" fill="#3B82F6" opacity="0.06" stroke="#3B82F6" stroke-width="0.8"/>
    <text x="745" y="142" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#3B82F6" text-anchor="middle" opacity="0.6">$12K</text>
    <!-- Line chart area -->
    <rect x="475" y="180" width="200" height="110" rx="6" fill="#3B82F6" opacity="0.04" stroke="#3B82F6" stroke-width="0.8"/>
    <path d="M490,270 L510,255 L530,260 L550,240 L570,245 L590,220 L610,225 L630,200 L650,210 L660,195" fill="none" stroke="#3B82F6" stroke-width="1.5"/>
    <!-- Pie chart -->
    <g transform="translate(770, 240)">
      <circle cx="0" cy="0" r="35" fill="none" stroke="#3B82F6" stroke-width="1"/>
      <path d="M0,0 L0,-35 A35,35 0 0,1 30,17 Z" fill="#3B82F6" opacity="0.3"/>
      <path d="M0,0 L30,17 A35,35 0 0,1 -20,28 Z" fill="#3B82F6" opacity="0.2"/>
      <path d="M0,0 L-20,28 A35,35 0 0,1 0,-35 Z" fill="#3B82F6" opacity="0.15"/>
    </g>
  </g>
  <!-- Insight sparkle -->
  <g transform="translate(850, 130)" opacity="0.15">
    <path d="M0,-10 L3,-3 L10,0 L3,3 L0,10 L-3,3 L-10,0 L-3,-3 Z" fill="#3B82F6"/>
  </g>
  <!-- Decorative circles -->
  <circle cx="180" cy="520" r="100" fill="#3B82F6" opacity="0.03"/>
  <circle cx="1100" cy="180" r="80" fill="#3B82F6" opacity="0.03"/>
  <!-- Level Badge -->
  <rect x="1040" y="30" width="210" height="42" rx="21" fill="#3B82F6"/>
  <text x="1145" y="57" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">◆ Intermediate</text>
  <!-- Title -->
  <text x="640" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="white" text-anchor="middle">AI Business Analytics</text>
  <text x="640" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#94A3B8" text-anchor="middle">Transform business data into actionable insights with AI</text>
  <rect x="540" y="480" width="200" height="3" rx="1.5" fill="#3B82F6" opacity="0.6"/>
  <!-- Bottom branding -->
  <text x="640" y="670" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#475569" text-anchor="middle" letter-spacing="2">AI BUSINESS ACADEMY</text>
  <rect x="440" y="685" width="400" height="1" fill="#334155" opacity="0.5"/>
</svg>