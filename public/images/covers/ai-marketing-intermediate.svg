<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>
  <!-- Dot pattern -->
  <g opacity="0.08">
    <circle cx="80" cy="80" r="2" fill="#EC4899"/><circle cx="120" cy="80" r="2" fill="#EC4899"/><circle cx="160" cy="80" r="2" fill="#EC4899"/>
    <circle cx="80" cy="120" r="2" fill="#EC4899"/><circle cx="120" cy="120" r="2" fill="#EC4899"/><circle cx="160" cy="120" r="2" fill="#EC4899"/>
    <circle cx="1100" cy="580" r="2" fill="#EC4899"/><circle cx="1140" cy="580" r="2" fill="#EC4899"/><circle cx="1180" cy="580" r="2" fill="#EC4899"/>
    <circle cx="1100" cy="620" r="2" fill="#EC4899"/><circle cx="1140" cy="620" r="2" fill="#EC4899"/><circle cx="1180" cy="620" r="2" fill="#EC4899"/>
  </g>
  <!-- Chart/funnel icons -->
  <g opacity="0.2">
    <!-- Rising chart -->
    <g transform="translate(400, 140)">
      <rect x="0" y="60" width="20" height="40" rx="3" fill="#EC4899" opacity="0.3"/>
      <rect x="30" y="40" width="20" height="60" rx="3" fill="#EC4899" opacity="0.4"/>
      <rect x="60" y="20" width="20" height="80" rx="3" fill="#EC4899" opacity="0.5"/>
      <rect x="90" y="0" width="20" height="100" rx="3" fill="#EC4899" opacity="0.6"/>
      <!-- Trend line -->
      <path d="M10,55 L40,35 L70,15 L100,-5" fill="none" stroke="#EC4899" stroke-width="2" stroke-dasharray="4,3"/>
    </g>
    <!-- Funnel -->
    <g transform="translate(720, 140)">
      <path d="M0,0 L120,0 L90,35 L30,35 Z" fill="none" stroke="#EC4899" stroke-width="1.5"/>
      <path d="M30,35 L90,35 L75,65 L45,65 Z" fill="none" stroke="#EC4899" stroke-width="1.5"/>
      <path d="M45,65 L75,65 L67,90 L53,90 Z" fill="#EC4899" opacity="0.3" stroke="#EC4899" stroke-width="1.5"/>
      <!-- Arrow down -->
      <path d="M60,95 L55,100 L60,105 L65,100 Z" fill="#EC4899" opacity="0.4"/>
    </g>
  </g>
  <!-- Target/bullseye -->
  <g transform="translate(600, 200)" opacity="0.12">
    <circle cx="0" cy="0" r="40" fill="none" stroke="#EC4899" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="25" fill="none" stroke="#EC4899" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="10" fill="#EC4899" opacity="0.4"/>
  </g>
  <!-- Decorative circles -->
  <circle cx="180" cy="520" r="100" fill="#EC4899" opacity="0.03"/>
  <circle cx="1120" cy="180" r="80" fill="#EC4899" opacity="0.03"/>
  <!-- Level Badge -->
  <rect x="1040" y="30" width="210" height="42" rx="21" fill="#3B82F6"/>
  <text x="1145" y="57" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">◆ Intermediate</text>
  <!-- Title -->
  <text x="640" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="white" text-anchor="middle">AI Campaign Optimization</text>
  <text x="640" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#94A3B8" text-anchor="middle">Optimize marketing campaigns with AI-driven insights</text>
  <rect x="540" y="480" width="200" height="3" rx="1.5" fill="#EC4899" opacity="0.6"/>
  <!-- Bottom branding -->
  <text x="640" y="670" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#475569" text-anchor="middle" letter-spacing="2">AI BUSINESS ACADEMY</text>
  <rect x="440" y="685" width="400" height="1" fill="#334155" opacity="0.5"/>
</svg>