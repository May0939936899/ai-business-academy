    <line x1="0" y1="0" x2="0" y2="-16" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="12" y2="6" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
