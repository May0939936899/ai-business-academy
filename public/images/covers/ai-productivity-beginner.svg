    <rect x="15" y="80" width="16" height="16" rx="3" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
    <line x1="40" y1="88" x2="110" y2="88" stroke="#F59E0B" stroke-width="1.5"/>
    <rect x="15" y="110" width="16" height="16" rx="3" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
    <line x1="40" y1="118" x2="95" y2="118" stroke="#F59E0B" stroke-width="1.5"/>
