    <line x1="40" y1="28" x2="115" y2="28" stroke="#F59E0B" stroke-width="1.5"/>
    <rect x="15" y="50" width="16" height="16" rx="3" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
    <path d="M19,58 L23,62 L29,54" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
