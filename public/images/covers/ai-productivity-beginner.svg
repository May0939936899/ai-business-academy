      <rect x="32" y="35" width="14" height="14" rx="2" fill="#F59E0B" opacity="0.15"/>
      <rect x="52" y="35" width="14" height="14" rx="2" fill="#F59E0B" opacity="0.15"/>
      <rect x="72" y="35" width="14" height="14" rx="2" fill="#F59E0B" opacity="0.15"/>
      <rect x="12" y="55" width="14" height="14" rx="2" fill="#F59E0B" opacity="0.15"/>
      <rect x="32" y="55" width="14" height="14" rx="2" fill="#F59E0B" opacity="0.15"/>
      <rect x="52" y="55" width="14" height="14" rx="2" fill="#F59E0B" opacity="0.4"/>
      <rect x="72" y="55" width="14" height="14" rx="2" fill="#F59E0B" opacity="0.15"/>
