  <text x="1155" y="57" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">● Beginner</text>
  <!-- Title -->
  <text x="640" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="white" text-anchor="middle">AI Productivity Tools</text>
  <text x="640" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#94A3B8" text-anchor="middle">Master essential AI tools to boost your daily productivity</text>
  <rect x="540" y="480" width="200" height="3" rx="1.5" fill="#F59E0B" opacity="0.6"/>
