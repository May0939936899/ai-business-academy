<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>
  <!-- Dot pattern -->
  <g opacity="0.08">
    <circle cx="80" cy="80" r="2" fill="#F59E0B"/><circle cx="120" cy="80" r="2" fill="#F59E0B"/><circle cx="160" cy="80" r="2" fill="#F59E0B"/><circle cx="200" cy="80" r="2" fill="#F59E0B"/>
    <circle cx="80" cy="120" r="2" fill="#F59E0B"/><circle cx="120" cy="120" r="2" fill="#F59E0B"/><circle cx="160" cy="120" r="2" fill="#F59E0B"/><circle cx="200" cy="120" r="2" fill="#F59E0B"/>
    <circle cx="1080" cy="580" r="2" fill="#F59E0B"/><circle cx="1120" cy="580" r="2" fill="#F59E0B"/><circle cx="1160" cy="580" r="2" fill="#F59E0B"/><circle cx="1200" cy="580" r="2" fill="#F59E0B"/>
    <circle cx="1080" cy="620" r="2" fill="#F59E0B"/><circle cx="1120" cy="620" r="2" fill="#F59E0B"/><circle cx="1160" cy="620" r="2" fill="#F59E0B"/><circle cx="1200" cy="620" r="2" fill="#F59E0B"/>
