<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>
  <!-- Dot pattern -->
  <g opacity="0.08">
    <circle cx="80" cy="80" r="2" fill="#10B981"/><circle cx="120" cy="80" r="2" fill="#10B981"/><circle cx="160" cy="80" r="2" fill="#10B981"/><circle cx="200" cy="80" r="2" fill="#10B981"/>
    <circle cx="80" cy="120" r="2" fill="#10B981"/><circle cx="120" cy="120" r="2" fill="#10B981"/><circle cx="160" cy="120" r="2" fill="#10B981"/><circle cx="200" cy="120" r="2" fill="#10B981"/>
    <circle cx="1080" cy="580" r="2" fill="#10B981"/><circle cx="1120" cy="580" r="2" fill="#10B981"/><circle cx="1160" cy="580" r="2" fill="#10B981"/><circle cx="1200" cy="580" r="2" fill="#10B981"/>
    <circle cx="1080" cy="620" r="2" fill="#10B981"/><circle cx="1120" cy="620" r="2" fill="#10B981"/><circle cx="1160" cy="620" r="2" fill="#10B981"/><circle cx="1200" cy="620" r="2" fill="#10B981"/>
  </g>
  <!-- Person icon -->
  <g transform="translate(580, 170)" opacity="0.25">
    <circle cx="60" cy="25" r="25" fill="none" stroke="#10B981" stroke-width="2.5"/>
    <path d="M20,90 Q20,55 60,55 Q100,55 100,90" fill="none" stroke="#10B981" stroke-width="2.5"/>
  </g>
  <!-- Resume/document icon -->
  <g transform="translate(420, 140)" opacity="0.15">
    <rect x="0" y="0" width="60" height="80" rx="6" fill="none" stroke="#10B981" stroke-width="1.5"/>
    <line x1="12" y1="20" x2="48" y2="20" stroke="#10B981" stroke-width="1.5"/>
    <line x1="12" y1="32" x2="42" y2="32" stroke="#10B981" stroke-width="1"/>
    <line x1="12" y1="42" x2="38" y2="42" stroke="#10B981" stroke-width="1"/>
    <line x1="12" y1="52" x2="44" y2="52" stroke="#10B981" stroke-width="1"/>
    <line x1="12" y1="62" x2="30" y2="62" stroke="#10B981" stroke-width="1"/>
  </g>
  <!-- Search/magnifying glass -->
  <g transform="translate(780, 160)" opacity="0.15">
    <circle cx="25" cy="25" r="25" fill="none" stroke="#10B981" stroke-width="2"/>
    <line x1="43" y1="43" x2="60" y2="60" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Checkmark icon -->
  <g transform="translate(870, 180)" opacity="0.12">
    <circle cx="20" cy="20" r="20" fill="none" stroke="#10B981" stroke-width="1.5"/>
    <path d="M10,20 L17,27 L30,13" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Decorative circles -->
  <circle cx="200" cy="500" r="100" fill="#10B981" opacity="0.03"/>
  <circle cx="1100" cy="200" r="80" fill="#10B981" opacity="0.04"/>
  <!-- Level Badge -->
  <rect x="1060" y="30" width="190" height="42" rx="21" fill="#10B981"/>
  <text x="1155" y="57" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">● Beginner</text>
  <!-- Title -->
  <text x="640" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="white" text-anchor="middle">AI for Recruitment</text>
  <text x="640" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#94A3B8" text-anchor="middle">Transform your hiring process with AI-powered tools</text>
  <rect x="540" y="480" width="200" height="3" rx="1.5" fill="#10B981" opacity="0.6"/>
  <!-- Bottom branding -->
  <text x="640" y="670" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#475569" text-anchor="middle" letter-spacing="2">AI BUSINESS ACADEMY</text>
  <rect x="440" y="685" width="400" height="1" fill="#334155" opacity="0.5"/>
</svg>