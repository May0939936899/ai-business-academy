<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>
  <!-- Dot pattern -->
  <g opacity="0.08">
    <circle cx="80" cy="80" r="2" fill="#EC4899"/><circle cx="120" cy="80" r="2" fill="#EC4899"/><circle cx="160" cy="80" r="2" fill="#EC4899"/><circle cx="200" cy="80" r="2" fill="#EC4899"/>
    <circle cx="80" cy="120" r="2" fill="#EC4899"/><circle cx="120" cy="120" r="2" fill="#EC4899"/><circle cx="160" cy="120" r="2" fill="#EC4899"/><circle cx="200" cy="120" r="2" fill="#EC4899"/>
    <circle cx="1080" cy="580" r="2" fill="#EC4899"/><circle cx="1120" cy="580" r="2" fill="#EC4899"/><circle cx="1160" cy="580" r="2" fill="#EC4899"/><circle cx="1200" cy="580" r="2" fill="#EC4899"/>
    <circle cx="1080" cy="620" r="2" fill="#EC4899"/><circle cx="1120" cy="620" r="2" fill="#EC4899"/><circle cx="1160" cy="620" r="2" fill="#EC4899"/><circle cx="1200" cy="620" r="2" fill="#EC4899"/>
  </g>
  <!-- Megaphone icon -->
  <g transform="translate(560, 190)" opacity="0.25">
    <path d="M0,0 L80,-30 L80,30 Z" fill="none" stroke="#EC4899" stroke-width="2.5"/>
    <rect x="-30" y="-15" width="35" height="30" rx="4" fill="none" stroke="#EC4899" stroke-width="2"/>
    <path d="M80,-30 Q110,-35 110,0 Q110,35 80,30" fill="none" stroke="#EC4899" stroke-width="1.5" stroke-dasharray="4,3"/>
    <path d="M90,-20 Q105,-22 105,0 Q105,22 90,20" fill="none" stroke="#EC4899" stroke-width="1.5"/>
  </g>
  <!-- Social media icons -->
  <g opacity="0.15">
    <!-- Like/heart -->
    <circle cx="400" cy="160" r="22" fill="none" stroke="#EC4899" stroke-width="1.5"/>
    <path d="M392,160 L400,168 L408,160 Q408,153 400,153 Q392,153 392,160Z" fill="#EC4899" opacity="0.4"/>
    <!-- Share -->
    <circle cx="860" cy="180" r="22" fill="none" stroke="#EC4899" stroke-width="1.5"/>
    <circle cx="855" cy="175" r="4" fill="#EC4899" opacity="0.4"/>
    <circle cx="868" cy="168" r="4" fill="#EC4899" opacity="0.4"/>
    <circle cx="868" cy="188" r="4" fill="#EC4899" opacity="0.4"/>
    <line x1="858" y1="174" x2="865" y2="170" stroke="#EC4899" stroke-width="1" opacity="0.4"/>
    <line x1="858" y1="178" x2="865" y2="186" stroke="#EC4899" stroke-width="1" opacity="0.4"/>
    <!-- Chat bubble -->
    <g transform="translate(750, 140)">
      <rect x="0" y="0" width="50" height="35" rx="8" fill="none" stroke="#EC4899" stroke-width="1.5"/>
      <polygon points="15,35 20,45 28,35" fill="none" stroke="#EC4899" stroke-width="1.5"/>
      <circle cx="15" cy="17" r="3" fill="#EC4899" opacity="0.3"/>
      <circle cx="25" cy="17" r="3" fill="#EC4899" opacity="0.3"/>
      <circle cx="35" cy="17" r="3" fill="#EC4899" opacity="0.3"/>
    </g>
  </g>
  <!-- Decorative circles -->
  <circle cx="200" cy="500" r="100" fill="#EC4899" opacity="0.03"/>
  <circle cx="1100" cy="200" r="80" fill="#EC4899" opacity="0.04"/>
  <!-- Level Badge -->
  <rect x="1060" y="30" width="190" height="42" rx="21" fill="#10B981"/>
  <text x="1155" y="57" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">● Beginner</text>
  <!-- Title -->
  <text x="640" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="white" text-anchor="middle">AI for Digital Marketing</text>
  <text x="640" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#94A3B8" text-anchor="middle">Leverage AI to transform your digital marketing efforts</text>
  <rect x="540" y="480" width="200" height="3" rx="1.5" fill="#EC4899" opacity="0.6"/>
  <!-- Bottom branding -->
  <text x="640" y="670" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#475569" text-anchor="middle" letter-spacing="2">AI BUSINESS ACADEMY</text>
  <rect x="440" y="685" width="400" height="1" fill="#334155" opacity="0.5"/>
</svg>