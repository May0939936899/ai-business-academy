<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>
  <!-- Dot pattern -->
  <g opacity="0.08">
    <circle cx="80" cy="80" r="2" fill="#3B82F6"/><circle cx="120" cy="80" r="2" fill="#3B82F6"/><circle cx="160" cy="80" r="2" fill="#3B82F6"/>
    <circle cx="80" cy="120" r="2" fill="#3B82F6"/><circle cx="120" cy="120" r="2" fill="#3B82F6"/><circle cx="160" cy="120" r="2" fill="#3B82F6"/>
    <circle cx="1100" cy="580" r="2" fill="#3B82F6"/><circle cx="1140" cy="580" r="2" fill="#3B82F6"/><circle cx="1180" cy="580" r="2" fill="#3B82F6"/>
  </g>
  <!-- Prediction/forecast chart -->
  <g opacity="0.22">
    <!-- Chart background -->
    <rect x="380" y="100" width="520" height="200" rx="10" fill="none" stroke="#3B82F6" stroke-width="1.5"/>
    <!-- Grid lines -->
    <line x1="380" y1="150" x2="900" y2="150" stroke="#3B82F6" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.2"/>
    <line x1="380" y1="200" x2="900" y2="200" stroke="#3B82F6" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.2"/>
    <line x1="380" y1="250" x2="900" y2="250" stroke="#3B82F6" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.2"/>
    <!-- Historical data (solid line) -->
    <path d="M400,260 L440,250 L480,255 L520,240 L560,230 L600,235 L640,215 L680,220 L700,200" fill="none" stroke="#3B82F6" stroke-width="2.5"/>
    <!-- Forecast data (dashed line going up) -->
    <path d="M700,200 L740,185 L780,170 L820,150 L860,135 L890,120" fill="none" stroke="#3B82F6" stroke-width="2" stroke-dasharray="8,4"/>
    <!-- Confidence band -->
    <path d="M700,200 L740,175 L780,155 L820,130 L860,110 L890,95 L890,145 L860,160 L820,170 L780,185 L740,195 L700,200 Z" fill="#3B82F6" opacity="0.08"/>
    <!-- Divider line (present) -->
    <line x1="700" y1="105" x2="700" y2="295" stroke="#3B82F6" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
    <text x="680" y="118" font-family="system-ui, sans-serif" font-size="9" fill="#3B82F6" opacity="0.5">NOW</text>
    <text x="790" y="118" font-family="system-ui, sans-serif" font-size="9" fill="#3B82F6" opacity="0.5">FORECAST</text>
    <!-- Data points -->
    <circle cx="400" cy="260" r="3" fill="#3B82F6"/>
    <circle cx="480" cy="255" r="3" fill="#3B82F6"/>
    <circle cx="560" cy="230" r="3" fill="#3B82F6"/>
    <circle cx="640" cy="215" r="3" fill="#3B82F6"/>
    <circle cx="700" cy="200" r="4" fill="#3B82F6"/>
  </g>
  <!-- Brain/AI icon -->
  <g transform="translate(330, 180)" opacity="0.1">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#3B82F6" stroke-width="1.5"/>
    <path d="M-15,-10 Q-15,5 0,5 Q15,5 15,-10" fill="none" stroke="#3B82F6" stroke-width="1.2"/>
    <path d="M-10,-15 Q0,-25 10,-15" fill="none" stroke="#3B82F6" stroke-width="1.2"/>
    <circle cx="-8" cy="-5" r="3" fill="#3B82F6" opacity="0.4"/>
    <circle cx="8" cy="-5" r="3" fill="#3B82F6" opacity="0.4"/>
  </g>
  <!-- Decorative circles -->
  <circle cx="180" cy="520" r="100" fill="#3B82F6" opacity="0.03"/>
  <circle cx="1100" cy="200" r="80" fill="#3B82F6" opacity="0.03"/>
  <!-- Level Badge -->
  <rect x="1060" y="30" width="190" height="42" rx="21" fill="#8B5CF6"/>
  <text x="1155" y="57" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">★ Advanced</text>
  <!-- Title -->
  <text x="640" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="white" text-anchor="middle">AI Predictive Analytics</text>
  <text x="640" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#94A3B8" text-anchor="middle">Forecast business trends with advanced AI models</text>
  <rect x="540" y="490" width="200" height="3" rx="1.5" fill="#3B82F6" opacity="0.6"/>
  <!-- Bottom branding -->
  <text x="640" y="670" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#475569" text-anchor="middle" letter-spacing="2">AI BUSINESS ACADEMY</text>
  <rect x="440" y="685" width="400" height="1" fill="#334155" opacity="0.5"/>
</svg>