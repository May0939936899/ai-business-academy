<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>
  <!-- Dot pattern -->
  <g opacity="0.08">
    <circle cx="80" cy="80" r="2" fill="#F59E0B"/><circle cx="120" cy="80" r="2" fill="#F59E0B"/><circle cx="160" cy="80" r="2" fill="#F59E0B"/>
    <circle cx="80" cy="120" r="2" fill="#F59E0B"/><circle cx="120" cy="120" r="2" fill="#F59E0B"/><circle cx="160" cy="120" r="2" fill="#F59E0B"/>
    <circle cx="1100" cy="580" r="2" fill="#F59E0B"/><circle cx="1140" cy="580" r="2" fill="#F59E0B"/><circle cx="1180" cy="580" r="2" fill="#F59E0B"/>
    <circle cx="1100" cy="620" r="2" fill="#F59E0B"/><circle cx="1140" cy="620" r="2" fill="#F59E0B"/><circle cx="1180" cy="620" r="2" fill="#F59E0B"/>
  </g>
  <!-- Kanban/workflow board -->
  <g opacity="0.2">
    <!-- Column 1: To Do -->
    <rect x="380" y="110" width="140" height="190" rx="8" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
    <rect x="380" y="110" width="140" height="30" rx="8" fill="#F59E0B" opacity="0.1"/>
    <text x="450" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#F59E0B" text-anchor="middle" opacity="0.8">TO DO</text>
    <rect x="395" y="150" width="110" height="28" rx="5" fill="#F59E0B" opacity="0.1" stroke="#F59E0B" stroke-width="0.5"/>
    <rect x="395" y="185" width="110" height="28" rx="5" fill="#F59E0B" opacity="0.1" stroke="#F59E0B" stroke-width="0.5"/>
    <rect x="395" y="220" width="110" height="28" rx="5" fill="#F59E0B" opacity="0.1" stroke="#F59E0B" stroke-width="0.5"/>
    <!-- Column 2: In Progress -->
    <rect x="540" y="110" width="140" height="190" rx="8" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
    <rect x="540" y="110" width="140" height="30" rx="8" fill="#F59E0B" opacity="0.15"/>
    <text x="610" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#F59E0B" text-anchor="middle" opacity="0.8">IN PROGRESS</text>
    <rect x="555" y="150" width="110" height="28" rx="5" fill="#F59E0B" opacity="0.15" stroke="#F59E0B" stroke-width="0.5"/>
    <rect x="555" y="185" width="110" height="28" rx="5" fill="#F59E0B" opacity="0.15" stroke="#F59E0B" stroke-width="0.5"/>
    <!-- Column 3: Done -->
    <rect x="700" y="110" width="140" height="190" rx="8" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
    <rect x="700" y="110" width="140" height="30" rx="8" fill="#F59E0B" opacity="0.1"/>
    <text x="770" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#F59E0B" text-anchor="middle" opacity="0.8">DONE</text>
    <rect x="715" y="150" width="110" height="28" rx="5" fill="#F59E0B" opacity="0.1" stroke="#F59E0B" stroke-width="0.5"/>
    <!-- Arrow between columns -->
    <path d="M525,200 L535,200" stroke="#F59E0B" stroke-width="1.5" opacity="0.4"/>
    <polygon points="535,197 540,200 535,203" fill="#F59E0B" opacity="0.4"/>
    <path d="M685,170 L695,170" stroke="#F59E0B" stroke-width="1.5" opacity="0.4"/>
    <polygon points="695,167 700,170 695,173" fill="#F59E0B" opacity="0.4"/>
  </g>
  <!-- Decorative circles -->
  <circle cx="180" cy="520" r="100" fill="#F59E0B" opacity="0.03"/>
  <circle cx="1100" cy="180" r="80" fill="#F59E0B" opacity="0.03"/>
  <!-- Level Badge -->
  <rect x="1040" y="30" width="210" height="42" rx="21" fill="#3B82F6"/>
  <text x="1145" y="57" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">◆ Intermediate</text>
  <!-- Title -->
  <text x="640" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="white" text-anchor="middle">AI Workflow Productivity</text>
  <text x="640" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#94A3B8" text-anchor="middle">Streamline team workflows with intelligent AI systems</text>
  <rect x="540" y="480" width="200" height="3" rx="1.5" fill="#F59E0B" opacity="0.6"/>
  <!-- Bottom branding -->
  <text x="640" y="670" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#475569" text-anchor="middle" letter-spacing="2">AI BUSINESS ACADEMY</text>
  <rect x="440" y="685" width="400" height="1" fill="#334155" opacity="0.5"/>
</svg>