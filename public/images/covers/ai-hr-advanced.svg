    <rect x="590" y="100" width="100" height="45" rx="8" fill="#10B981" opacity="0.15" stroke="#10B981" stroke-width="1.5"/>
    <!-- Middle boxes -->
    <rect x="430" y="185" width="90" height="40" rx="6" fill="none" stroke="#10B981" stroke-width="1.2"/>
    <rect x="595" y="185" width="90" height="40" rx="6" fill="none" stroke="#10B981" stroke-width="1.2"/>
    <rect x="760" y="185" width="90" height="40" rx="6" fill="none" stroke="#10B981" stroke-width="1.2"/>
    <!-- Bottom boxes -->
    <rect x="370" y="260" width="70" height="32" rx="5" fill="none" stroke="#10B981" stroke-width="0.8" opacity="0.6"/>
    <rect x="460" y="260" width="70" height="32" rx="5" fill="none" stroke="#10B981" stroke-width="0.8" opacity="0.6"/>
    <rect x="700" y="260" width="70" height="32" rx="5" fill="none" stroke="#10B981" stroke-width="0.8" opacity="0.6"/>
    <rect x="790" y="260" width="70" height="32" rx="5" fill="none" stroke="#10B981" stroke-width="0.8" opacity="0.6"/>
    <!-- Vertical lines from top -->
    <line x1="640" y1="145" x2="640" y2="185" stroke="#10B981" stroke-width="1.2"/>
    <line x1="475" y1="170" x2="640" y2="170" stroke="#10B981" stroke-width="1.2"/>
    <line x1="805" y1="170" x2="640" y2="170" stroke="#10B981" stroke-width="1.2"/>
    <line x1="475" y1="170" x2="475" y2="185" stroke="#10B981" stroke-width="1.2"/>
    <line x1="805" y1="170" x2="805" y2="185" stroke="#10B981" stroke-width="1.2"/>
    <!-- Lines to bottom boxes -->
    <line x1="475" y1="225" x2="475" y2="245" stroke="#10B981" stroke-width="0.8" opacity="0.6"/>
    <line x1="405" y1="245" x2="495" y2="245" stroke="#10B981" stroke-width="0.8" opacity="0.6"/>
    <line x1="405" y1="245" x2="405" y2="260" stroke="#10B981" stroke-width="0.8" opacity="0.6"/>
    <line x1="495" y1="245" x2="495" y2="260" stroke="#10B981" stroke-width="0.8" opacity="0.6"/>
    <line x1="805" y1="225" x2="805" y2="245" stroke="#10B981" stroke-width="0.8" opacity="0.6"/>
    <line x1="735" y1="245" x2="825" y2="245" stroke="#10B981" stroke-width="0.8" opacity="0.6"/>
    <line x1="735" y1="245" x2="735" y2="260" stroke="#10B981" stroke-width="0.8" opacity="0.6"/>
    <line x1="825" y1="245" x2="825" y2="260" stroke="#10B981" stroke-width="0.8" opacity="0.6"/>
  </g>
  <!-- AI sparkle -->
  <g transform="translate(640, 120)" opacity="0.3">
    <path d="M0,-8 L2,-2 L8,0 L2,2 L0,8 L-2,2 L-8,0 L-2,-2 Z" fill="#10B981"/>
  </g>
  <!-- Decorative circles -->
  <circle cx="180" cy="520" r="100" fill="#10B981" opacity="0.03"/>
  <circle cx="1100" cy="200" r="80" fill="#10B981" opacity="0.03"/>
  <!-- Level Badge -->
  <rect x="1060" y="30" width="190" height="42" rx="21" fill="#8B5CF6"/>
  <text x="1155" y="57" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">★ Advanced</text>
  <!-- Title -->
  <text x="640" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="white" text-anchor="middle">AI Workforce Strategy</text>
  <text x="640" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#94A3B8" text-anchor="middle">Design AI-driven workforce strategies for the future</text>
  <rect x="540" y="490" width="200" height="3" rx="1.5" fill="#10B981" opacity="0.6"/>
  <!-- Bottom branding -->
  <text x="640" y="670" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#475569" text-anchor="middle" letter-spacing="2">AI BUSINESS ACADEMY</text>
  <rect x="440" y="685" width="400" height="1" fill="#334155" opacity="0.5"/>
</svg>